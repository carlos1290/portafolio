<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Te perdiste en el abismo | Carlos Gonzalez</title>
    <meta name="robots" content="noindex" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #0e6a8f 0%, #072a4d 45%, #020810 100%);
        color: #eaf6fb;
        font-family: 'Sora', system-ui, sans-serif;
        text-align: center;
      }
      main {
        padding: 2rem;
        max-width: 480px;
      }
      .depth {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 0.8rem;
        letter-spacing: 0.25em;
        color: #35e0d2;
        text-transform: uppercase;
      }
      h1 {
        font-size: 4rem;
        margin: 0.5rem 0;
      }
      p {
        color: rgba(214, 238, 248, 0.75);
        line-height: 1.7;
      }
      a.btn {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.8rem 1.6rem;
        border-radius: 999px;
        background: #35e0d2;
        color: #04222b;
        font-weight: 600;
        text-decoration: none;
      }
      a.btn:hover {
        background: #6cf0e4;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="depth">−9999 m · fuera del mapa</p>
      <h1>404</h1>
      <p>
        Esta ruta se hundió demasiado profundo. Volvé a la superficie y seguí buceando por el
        portafolio.
      </p>
      <a class="btn" href="/portafolio/">↑ Volver a la superficie</a>
    </main>
  </body>
</html>

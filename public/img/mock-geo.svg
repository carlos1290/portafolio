    <circle cx="560" cy="80" r="8" fill="#ff5f57"/><circle cx="120" cy="280" r="8" fill="#ff5f57"/><circle cx="640" cy="240" r="8" fill="#ff5f57"/>
    <text x="560" y="60" fill="#ff8f89" font-size="11" text-anchor="middle">fuera de marco</text>
    <text x="120" y="310" fill="#ff8f89" font-size="11" text-anchor="middle">fuera de marco</text>
  </g>
  <!-- panel lateral -->
  <rect x="500" y="180" width="200" height="140" rx="10" fill="#0b1220" opacity="0.92"/>

  <text x="516" y="254" fill="#febc2e" font-size="13">● 9 dudosas</text>
  <text x="516" y="276" fill="#ff5f57" font-size="13">● 3 fuera de marco</text>
  <text x="516" y="302" fill="#7c8db0" font-size="10">Google Maps · georreferencia</text>
  <rect x="20" y="20" width="230" height="34" rx="8" fill="#0b1220" opacity="0.92"/>
